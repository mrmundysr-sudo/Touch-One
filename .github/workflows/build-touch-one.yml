name: Build Touch-One APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and validate visual assets
        run: |
          python3 scripts/restore_visual_assets.py \
            --resource-dir source/app/src/main/res/drawable-nodpi \
            --source-zip TouchOne-1.3.31-Scoobert-source-modified.zip \
            --baseline-apk-zip TouchOne-1.3.31-apk.zip
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=/tmp/touch-one-app-build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          echo "APK size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -gt 10485760
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchOne-Scoobert-debug
          path: /tmp/touch-one-app-build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
