name: Build Touch-One APK

on:
  push:
    branches: [main, touch-one-claude]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Reassemble Touch Developer uploads
        run: |
          curl --fail --location --retry 3 --output /tmp/reassemble_touch_uploads.py \
            'https://raw.githubusercontent.com/mrmundysr-sudo/Touch-Developer-/main/tools/reassemble_touch_uploads.py'
          python3 /tmp/reassemble_touch_uploads.py
      - name: Extract uploaded source ZIP
        run: |
          test -s 'files (4).zip'
          test "$(stat -c%s 'files (4).zip')" -gt 1000000
          unzip -t 'files (4).zip'
          mkdir -p /tmp/touch-one-upload
          unzip -q 'files (4).zip' -d /tmp/touch-one-upload
          if test -f /tmp/touch-one-upload/Touch-One-1.4.0.zip; then
            mkdir -p /tmp/touch-one-source
            unzip -q /tmp/touch-one-upload/Touch-One-1.4.0.zip -d /tmp/touch-one-source
          else
            cp -a /tmp/touch-one-upload/. /tmp/touch-one-source/
          fi
          find /tmp/touch-one-source -name settings.gradle -o -name settings.gradle.kts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build uploaded Touch One source
        run: |
          set -euo pipefail
          ROOT="$(find /tmp/touch-one-source -name settings.gradle -o -name settings.gradle.kts | head -1)"
          test -n "$ROOT"
          ROOT="$(dirname "$ROOT")"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APK="$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)"
          test -s "$APK"
          cp "$APK" /tmp/touch-one-new-debug.apk
      - name: Verify APK
        run: |
          APK=/tmp/touch-one-new-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          echo "APK size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -gt 1000000
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchOne-Scoobert-debug
          path: /tmp/touch-one-new-debug.apk
          if-no-files-found: error
