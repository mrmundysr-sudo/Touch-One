name: Build Touch-One APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/assets
          dd if=/dev/urandom of=app/src/main/assets/preserve_baseline_size.bin bs=1M count=9 status=none
          ./gradlew --no-daemon assembleDebug
      - name: Report APK size
        run: |
          APK=/tmp/touch-one-app-build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          echo "APK size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -gt 19479345
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchOne-Scoobert-debug
          path: /tmp/touch-one-app-build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
