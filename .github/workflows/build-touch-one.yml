name: Build Touch-One APK

on:
  push:
    branches: [main, touch-one-claude]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Reassemble Touch Developer uploads
        run: |
          curl --fail --location --retry 3 --output /tmp/reassemble_touch_uploads.py \
            'https://raw.githubusercontent.com/mrmundysr-sudo/Touch-Developer-/main/tools/reassemble_touch_uploads.py'
          python3 /tmp/reassemble_touch_uploads.py
      - name: Extract uploaded source ZIP
        run: |
          test -s 'files (4).zip'
          test "$(stat -c%s 'files (4).zip')" -gt 1000000
          unzip -t 'files (4).zip'
          mkdir -p /tmp/touch-one-upload
          unzip -q 'files (4).zip' -d /tmp/touch-one-upload
          find /tmp/touch-one-upload -name settings.gradle -o -name settings.gradle.kts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build uploaded Touch One source
        run: |
          set -euo pipefail
          ROOT="$(find /tmp/touch-one-upload -name settings.gradle -o -name settings.gradle.kts | head -1)"
          test -n "$ROOT"
          ROOT="$(dirname "$ROOT")"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APK="$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)"
          test -s "$APK"
          cp "$APK" /tmp/touch-one-new-debug.apk
      - name: Verify APK
        run: |
          APK=/tmp/touch-one-new-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          echo "APK size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -gt 1000000
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TouchOne-Scoobert-debug
          path: /tmp/touch-one-new-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Publish APK as pre-release
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          FILES=(/tmp/touch-one-new-debug.apk)
          [ "${#FILES[@]}" -gt 0 ] || { echo "no APK found"; exit 1; }
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" "${FILES[@]}" \
            --target "${{ github.sha }}" --prerelease \
            --title "APK build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}"
