name: Build Touch-One APK

on:
  push:
    branches: [main, touch-one-claude]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Retrieve uploaded source ZIP
        run: |
          curl --fail --location --retry 3 --output /tmp/touch-one-upload.zip 'https://media.githubusercontent.com/media/mrmundysr-sudo/Touch-One/main/files%20%284%29.zip'
          test "$(stat -c%s /tmp/touch-one-upload.zip)" -gt 1000000
          unzip -t /tmp/touch-one-upload.zip
          unzip -Z -1 /tmp/touch-one-upload.zip | head -80
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate visual assets
        run: |
          python3 scripts/restore_visual_assets.py \
            --resource-dir source/app/src/main/res/drawable-nodpi \
            --win-gif source/app/src/main/res/raw/win_scoobert.gif
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=/tmp/touch-one-app-build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          echo "APK size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -gt 19479345
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchOne-Scoobert-debug
          path: /tmp/touch-one-app-build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
