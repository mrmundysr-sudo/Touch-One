plugins { id "com.android.application" }
android {
    namespace "com.touchone.game"
    compileSdk 35
    defaultConfig {
        applicationId "com.touchone.game"
        minSdk 23
        targetSdk 35
        versionCode 39
        versionName "1.4.0"
    }
    androidResources {
        noCompress += ["png", "wav"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
